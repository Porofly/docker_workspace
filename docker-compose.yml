services:
  uwb-recon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uwb-recon
    network_mode: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    stdin_open: true
    tty: true
    restart: unless-stopped
