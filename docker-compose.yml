services:
  ros2:
    build:
      context: .
      dockerfile: ros2/Dockerfile
    image: ${PROJECT_NAME:-px4ros2-jetson}-ros2:latest
    container_name: ros2
    privileged: true
    network_mode: host
    ipc: host
    runtime: nvidia
    environment:
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      DRONE_ID: ${DRONE_ID:-1}
    volumes:
      - /tmp:/tmp
      - /dev:/dev
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
               source /root/ros2_ws/install/local_setup.bash &&
               MicroXRCEAgent udp4 --port 8888 &
               sleep 2 &&
               ros2 launch swarm_bridge swarm_bridge.launch.py"

  px4:
    build:
      context: .
      dockerfile: px4/Dockerfile
    image: ${PROJECT_NAME:-px4ros2-jetson}-px4:latest
    container_name: px4
    privileged: true
    network_mode: host
    ipc: host
    volumes:
      - ./start.sh:/root/start.sh
    stdin_open: true
    tty: true
    restart: unless-stopped
    depends_on:
      - ros2
    command: /root/start.sh
